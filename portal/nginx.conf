server {
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: never expose the API port to the public Internet.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA with history-mode routing: fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
