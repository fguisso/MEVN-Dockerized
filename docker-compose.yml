services:
  api:
    container_name: api
    build:
      context: ./api
    env_file: ./api/.env
    ports:
      - "3000:3000"
    networks:
      - mevn-dockerized
    depends_on:
      - mongodb

  mongodb:
    container_name: mongodb
    image: mongo:8
    volumes:
      - mongodb-data:/data/db
    networks:
      - mevn-dockerized

  portal:
    container_name: portal
    build:
      context: ./portal
    ports:
      - "8080:8080"

networks:
  mevn-dockerized:

volumes:
  mongodb-data:
